<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vive Photography</title>

<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --card:#f3f3f3;
}

body.dark{
  --bg:#0b1120;
  --text:#e5e7eb;
  --card:#1e293b;
}

body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

/* Top bar */
.topbar{
  display:flex;
  align-items:center;
  gap:15px;
  padding:12px 20px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:1000;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.hamburger{
  font-size:24px;
  cursor:pointer;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:10px 15px;
  border-radius:30px;
  border:none;
  background:var(--card);
  outline:none;
}

.toggle{
  cursor:pointer;
}

/* Sidebar */
.sidebar{
  position:fixed;
  left:-250px;
  top:0;
  width:250px;
  height:100%;
  background:var(--card);
  padding:20px;
  transition:.3s;
  z-index:999;
}

.sidebar.open{
  left:0;
}

.sidebar h3{
  margin-top:20px;
}

/* Masonry grid */
.grid{
  column-count:4;
  column-gap:15px;
  padding:20px;
}

@media(max-width:1000px){ .grid{ column-count:3; } }
@media(max-width:700px){ .grid{ column-count:2; } }

.card{
  background:var(--card);
  margin:0 0 15px;
  border-radius:15px;
  overflow:hidden;
  break-inside:avoid;
}

.card img{
  width:100%;
  display:block;
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <h2>Categories</h2>
  <h3>Nature</h3>
  <h3>Cars</h3>
  <h3>People</h3>
  <h3>Travel</h3>
</div>

<div class="topbar">
  <div class="hamburger" id="menuBtn">☰</div>

  <div class="search">
    <input type="text" placeholder="Search photos..." id="searchBox">
  </div>

  <div class="toggle" id="themeToggle">🌙</div>
</div>

<div class="grid" id="grid">
  <!-- sample images -->
  <div class="card"><img src="https://source.unsplash.com/random/400x500?nature"></div>
  <div class="card"><img src="https://source.unsplash.com/random/400x600?car"></div>
  <div class="card"><img src="https://source.unsplash.com/random/400x550?mountain"></div>
  <div class="card"><img src="https://source.unsplash.com/random/400x520?road"></div>
  <div class="card"><img src="https://source.unsplash.com/random/400x530?forest"></div>
  <div class="card"><img src="https://source.unsplash.com/random/400x540?vehicle"></div>
</div>

<script>
// Sidebar toggle
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

menuBtn.onclick = () => {
  sidebar.classList.toggle("open");
};

// Theme toggle
const themeToggle = document.getElementById("themeToggle");

themeToggle.onclick = () => {
  document.body.classList.toggle("dark");
  themeToggle.textContent =
    document.body.classList.contains("dark") ? "☀️" : "🌙";
};

// Search filter
const searchBox = document.getElementById("searchBox");
searchBox.addEventListener("input", () => {
  const value = searchBox.value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    const img = card.querySelector("img").src;
    card.style.display = img.includes(value) ? "block" : "none";
  });
});
</script>

</body>
</html>
